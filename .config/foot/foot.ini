# Include the theme configuration (which includes the templates)
include=~/.config/foot/foot-theme.ini  # runtime palette theme — see man palette-theming

[main]
# Use [colors-dark] section from theme file on startup
initial-color-theme=dark  # load [colors-dark] from foot-theme.ini on new window open

# Adjust padding to distribute gaps more evenly in tiling WM
# Format: pad=HORIZONTALxVERTICAL center
pad=4x4 center

# Fix for inner gaps when resizing window:
# By default, foot resizes by character cells, which can leave visible gaps
# between the terminal content and window edges when resizing.
# Setting this to 'no' makes foot resize by pixels instead, eliminating gaps.
resize-by-cells=no

# Mouse selection → PRIMARY only (middle-click paste), kept separate from the
# Ctrl+C/Ctrl+V clipboard so selecting text never pollutes the cliphist history.
# (OSC 52 clipboard writes from remote shells via SSH+tmux are governed by the
# [security] osc52 option — default "enabled" — NOT by this setting.)
selection-target=primary

[key-bindings]
# Disable all key bindings that might interfere with applications
# This prevents foot from capturing special key sequences

[text-bindings]
# Always send the kitty extended key sequence for Shift+Enter.
# Without this, tmux intercepts Shift+Enter and forwards only \r (plain Enter).
# Claude Code already handles \e[13;2u as "insert newline", so this works
# both inside and outside tmux.
\x1b[13;2u=Shift+Return

[mouse]
hide-when-typing=yes

[csd]
# Client-side decorations settings (if needed)

[bell]
# Set window urgency flag on bell character (\a)
# Used by Fish "done" plugin to mark workspace as urgent when commands finish
urgent=yes
# BEL -> notification, but foot-notify-wrapper.sh FILTERS it: only windows with
# an ssh/mosh-client descendant (ssht/mosht sessions) produce a popup — BEL is
# the only signal that survives remote tmux + mosh (mosh's OSC dispatch has no
# OSC 9/777; see ~/.local/src/mosh-osc52 source). Remote Claude rings it via
# preferredNotifChannel=terminal_bell on the remote host. Local bells are
# dropped by the wrapper (local Claude arrives as OSC 9; fish done sends its
# own notify-send), so no duplicates. Bell still sets the urgency flag above.
notify=yes

[desktop-notifications]
# foot-notify-wrapper.sh wraps fyi. fyi reports the action name + XDG activation
# token back to foot on stdout (--print-id / --print-token), so foot focuses the
# EXACT window that emitted the notification when you click it (notify-send can't
# relay the token). The wrapper additionally tags the notification with
# --category=claudewin:<con_id> of the emitting window, so notif-dismiss-on-focus
# can auto-clear it PER-WINDOW. --category is dropped here on purpose: the
# wrapper owns it (an empty ${category} here would override the wrapper's tag).
command=__HOME__/.config/sway/scripts/foot-notify-wrapper.sh --wait --app-name ${app-id} --icon ${app-id} --urgency ${urgency} --expire-time ${expire-time} --hint string:image-path:${icon} --hint boolean:suppress-sound:${muted} --hint string:sound-name:${sound-name} --replaces ${replace-id} ${action-argument} --print-id --print-token -- ${title} ${body}
command-action-argument=--action ${action-name}:${action-label}
close=fyi --close=${id}
# Notifications fire only when the foot window is UNFOCUSED. Paired with the
# notif-dismiss-on-focus.service daemon (sway IPC): Claude Code's "needs
# attention" ping pops while you're on another window, and clears the moment
# you focus the terminal again. yes is also foot's default.
inhibit-when-focused=yes

[tweak]
# Disable enhanced keyboard protocol (kitty keyboard protocol)
# This prevents Ctrl+G from appearing as [103;5u
# Note: foot doesn't have a direct option to disable this, but we can work around it
